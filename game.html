<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>待ち時間ミニゲーム - 恐竜ARスタンプラリー</title>
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/game.css?v=2">
  <script src="js/dinosaurs.js"></script>
  <script defer src="js/preload.js"></script>
  <script defer src="js/game-assets/p5.js"></script>
  <script defer src="js/game-assets/class.js?v=2"></script>
  <script defer src="js/ranking.js?v=7"></script>
  <script defer src="js/game-assets/sketch.js?v=6"></script>

  <style>
    #ranking-modal[hidden] { display: none; }
    #ranking-modal {
      position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
      padding: 18px; background: rgba(3, 7, 18, 0.88); color: #fff;
    }
    .ranking-box {
      width: min(92vw, 420px); max-height: 88vh; overflow-y: auto; box-sizing: border-box;
      padding: 22px; border: 2px solid #22d3ee; border-radius: 16px;
      background: #111827; text-align: center; box-shadow: 0 0 28px rgba(34, 211, 238, 0.35);
    }
    .ranking-box h2 { margin: 0 0 8px; color: #67e8f9; }
    .ranking-score { font-size: 1.15rem; }
    #ranking-player-name {
      width: 100%; box-sizing: border-box; margin: 8px 0; padding: 12px;
      border: 1px solid #94a3b8; border-radius: 8px; font-size: 16px;
    }
    .ranking-box button {
      width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 8px;
      font-weight: 700; font-size: 15px; cursor: pointer;
    }
    #ranking-submit-button { background: #22d3ee; color: #082f49; }
    #ranking-retry-button { background: #e5e7eb; color: #111827; }
    #ranking-home-button {
      display: block; box-sizing: border-box; width: 100%; margin-top: 8px; padding: 12px;
      border-radius: 8px; background: #475569; color: #fff; font-weight: 700;
      font-size: 15px; text-decoration: none;
    }
    #ranking-list { text-align: left; padding-left: 2.2em; line-height: 1.75; }
    #ranking-status { min-height: 1.5em; margin: 8px 0 0; font-size: 0.88rem; color: #a7f3d0; }
    #ranking-status.is-error { color: #fca5a5; }

    #ranking-reward[hidden] { display: none; }
    #ranking-reward {
      margin: 14px 0; padding: 14px; border: 2px solid #facc15; border-radius: 12px;
      background: linear-gradient(180deg, rgba(250, 204, 21, 0.18), rgba(245, 158, 11, 0.08));
    }
    #ranking-reward h3 { margin: 0 0 6px; color: #fde047; font-size: 1.25rem; }
    #ranking-reward p { margin: 0 0 10px; line-height: 1.55; }
    #reward-download-button {
      display: block; box-sizing: border-box; width: 100%; padding: 13px; border-radius: 8px;
      background: #facc15; color: #422006; font-weight: 800; text-decoration: none;
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.28);
    }
  </style>
</head>
<body class="game-page-body">
  <div id="game-shell">
    <div class="game-top-panel">
      <div class="download-mini-status">
        <span>モデル：</span><strong data-download-status>ダウンロード進行中</strong>
      </div>
      <div class="mini-progress-track"><div class="mini-progress-fill" data-progress-bar></div></div>
      <div class="game-actions">
        <a class="button light js-game-nav" href="index.html">元のページに戻る</a>
      </div>
    </div>

    <div id="game-container">
      <div id="title-ui">
        <h1>スターダストクルセイダース</h1>
        <p class="blink">- TAP START -</p>
        <p class="title-help">縦型：白い点だけが当たり判定 / 指を動かした分だけ移動</p>
      </div>
    </div>
  </div>


  <div id="ranking-modal" hidden aria-modal="true" role="dialog" aria-labelledby="ranking-result-title">
    <div class="ranking-box">
      <h2 id="ranking-result-title">GAME OVER</h2>
      <p class="ranking-score">今回のスコア：<strong id="ranking-final-score">0</strong>点</p>
      <input id="ranking-player-name" type="text" maxlength="10" placeholder="名前を入力（10文字まで）" autocomplete="nickname">
      <button id="ranking-submit-button" type="button">ランキングに登録</button>

      <section id="ranking-reward" hidden aria-live="polite">
        <h3>クエスト達成！</h3>
        <p>10,000点突破おめでとう！<br>ARマーカー6種類の報酬PDFを獲得しました。</p>
        <a id="reward-download-button" href="assets/rewards/ar-markers-reward.pdf" download="恐竜ARマーカー6種_報酬.pdf">報酬PDFをダウンロード</a>
      </section>
      <h3>共有ランキング TOP10</h3>
      <ol id="ranking-list"></ol>
      <p id="ranking-status" role="status" aria-live="polite"></p>
      <button id="ranking-retry-button" type="button">もう一度遊ぶ</button>
      <a id="ranking-home-button" class="js-game-nav" href="index.html">元のページに戻る</a>
    </div>
  </div>

  <script>
    // p5.js はスマホの touch 系イベントを強く拾うため、
    // 上部ナビだけは capture 段階で先に処理して確実に遷移させる。
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.js-game-nav').forEach(function (link) {
        const go = function (event) {
          event.preventDefault();
          event.stopPropagation();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          const href = link.getAttribute('href');
          if (href) window.location.assign(href);
        };
        const stopOnly = function (event) {
          event.stopPropagation();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        };

        link.addEventListener('touchstart', stopOnly, { capture: true, passive: false });
        link.addEventListener('pointerdown', stopOnly, { capture: true });
        link.addEventListener('mousedown', stopOnly, { capture: true });
        link.addEventListener('touchend', go, { capture: true, passive: false });
        link.addEventListener('pointerup', go, { capture: true });
        link.addEventListener('click', go, { capture: true });
      });
    });
  </script>
</body>
</html>
