<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>恐竜ARスタンプラリー</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="js/dinosaurs.js"></script>
  <script src="js/collection.js"></script>

  <script>
    AFRAME.registerComponent('fit-gltf-on-marker', {
      schema: {
        target: { type: 'number', default: 1.2 },
        yOffset: { type: 'number', default: 0.04 }
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh || !window.THREE) return;

          // ⭕ 親の a-marker から恐竜のIDを取得し、dinosaurs.js から設定を読み込む
          const markerEl = this.el.closest('a-marker');
          const dinoId = markerEl ? markerEl.dataset.dinoId : null;
          const dinoData = window.DINOSAURS ? window.DINOSAURS.find(d => d.id === dinoId) : null;

          // ⭕ dinosaurs.js に設定があればそちらを優先、なければデフォルト値を使用
          const targetSize = (dinoData && dinoData.arFitTarget !== undefined) ? dinoData.arFitTarget : this.data.target;
          const yOffsetVal = (dinoData && dinoData.arYOffset !== undefined) ? dinoData.arYOffset : this.data.yOffset;

          const scene = this.el.sceneEl;
          if (scene && scene.renderer) {
            try {
              scene.renderer.setClearColor(new THREE.Color(0x000000), 0);
              scene.renderer.setClearAlpha(0);
            } catch (e) {}
          }

          this.el.object3D.scale.set(1, 1, 1);
          this.el.object3D.position.set(0, 0, 0);
          mesh.position.set(0, 0, 0);
          this.el.object3D.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(mesh);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          const maxSize = Math.max(size.x, size.y, size.z);
          const scale = maxSize > 0 ? targetSize / maxSize : 1; // ⭕ 変更

          this.el.object3D.scale.set(scale, scale, scale);
          this.el.object3D.position.set(0, 0, 0);
          mesh.position.set(
            -center.x,
            -box.min.y + (yOffsetVal / scale),
            -center.z
          );
          this.el.object3D.updateMatrixWorld(true);
        });

        this.el.addEventListener('model-error', (e) => {
          const status = document.getElementById('status');
          if (status) status.textContent = 'GLBモデルの読み込みに失敗しました。ファイル名を確認してください。';
          console.error('GLB model-error:', e);
        });
      }
    });

    function makeRendererTransparent() {
      const scene = document.querySelector('a-scene');
      if (!scene || !scene.renderer || !window.THREE) return;
      try {
        scene.renderer.setClearColor(new THREE.Color(0x000000), 0);
        scene.renderer.setClearAlpha(0);
        if (scene.object3D) scene.object3D.background = null;
      } catch (e) {}
    }

    function applyARCameraFitOnce() {
      const videos = document.querySelectorAll('video, #arjs-video, .arjs-video');
      const canvases = document.querySelectorAll('a-scene canvas, canvas.a-canvas, .a-canvas');
      const viewport = window.visualViewport || window;
      const vw = viewport.width || window.innerWidth;
      const vh = viewport.height || window.innerHeight;

      // 1. AR.jsが設定しているカメラ映像の本来の比率（今回は 1280x720 = 16:9）
      let videoAspect = 16 / 9; 
      if (videos.length > 0 && videos[0].videoWidth && videos[0].videoHeight) {
        videoAspect = videos[0].videoWidth / videos[0].videoHeight;
      }
      
      // 2. 現在のスマートフォンの画面の比率
      const screenAspect = vw / vh;

      let videoW, videoH;

      // 3. 画面の比率とカメラの比率を比較して、隙間ができない最小の拡大サイズを自動計算（object-fit: coverの再現）
      if (screenAspect > videoAspect) {
        // 横に広いデバイス（タブレットやスマホの横向き）
        videoW = Math.ceil(vw);
        videoH = Math.ceil(vw / videoAspect);
      } else {
        // 縦に長いデバイス（最新の超縦長スマホなど）
        videoH = Math.ceil(vh);
        videoW = Math.ceil(vh * videoAspect);
      }

      // CSS変数に正確な計算値をセット
      document.documentElement.style.setProperty('--real-vw', `${vw}px`);
      document.documentElement.style.setProperty('--real-vh', `${vh}px`);
      document.documentElement.style.setProperty('--camera-vw', `${videoW}px`);
      document.documentElement.style.setProperty('--camera-vh', `${videoH}px`);

      videos.forEach((video) => {
        video.style.setProperty('position', 'fixed', 'important');
        video.style.setProperty('left', '50%', 'important');
        video.style.setProperty('top', '50%', 'important'); // 👈 上下左右の中央に配置
        video.style.setProperty('right', 'auto', 'important');
        video.style.setProperty('bottom', 'auto', 'important');
        video.style.setProperty('width', `${videoW}px`, 'important');
        video.style.setProperty('height', `${videoH}px`, 'important'); // 👈 画面のvhではなく、アスペクト比を維持した計算値にする
        video.style.setProperty('min-width', `${videoW}px`, 'important');
        video.style.setProperty('min-height', `${videoH}px`, 'important');
        video.style.setProperty('max-width', 'none', 'important');
        video.style.setProperty('max-height', 'none', 'important');
        video.style.setProperty('object-fit', 'cover', 'important');
        video.style.setProperty('object-position', 'center center', 'important');
        video.style.setProperty('transform', 'translate(-50%, -50%)', 'important'); // 👈 上下左右の中央寄せ
        video.style.setProperty('z-index', '0', 'important');
      });

      canvases.forEach((canvas) => {
        canvas.style.setProperty('position', 'fixed', 'important');
        canvas.style.setProperty('left', '0px', 'important');
        canvas.style.setProperty('top', '0px', 'important');
        canvas.style.setProperty('width', `${vw}px`, 'important');
        canvas.style.setProperty('height', `${vh}px`, 'important');
        canvas.style.setProperty('background', 'transparent', 'important');
        canvas.style.setProperty('z-index', '2', 'important');
      });

      makeRendererTransparent();
    }

    function scheduleCameraFit() {
      applyARCameraFitOnce();
      setTimeout(applyARCameraFitOnce, 350);
      setTimeout(applyARCameraFitOnce, 1200);
      setTimeout(applyARCameraFitOnce, 2500);
    }

    window.addEventListener('load', () => {
      const scene = document.querySelector('a-scene');
      scheduleCameraFit();
      scene?.addEventListener('loaded', scheduleCameraFit);
      scene?.addEventListener('renderstart', scheduleCameraFit, { once: true });
    });

    window.addEventListener('resize', () => setTimeout(applyARCameraFitOnce, 300));
    window.addEventListener('orientationchange', () => setTimeout(scheduleCameraFit, 650));
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* 上部の説明吹き出しは本番UIを小さくするため非表示 */
    .top-help {
      display: none;
    }

    /* ============================================================
       本番用の下部操作パネル
       画面の約3分の1以内に収まるように、文字・余白・ボタンを小さめにしています。
       表示内容：
       ・認識中のマーカー名
       ・コレクション追加ボタン
       ・トップへ戻るボタン
       ・サイズ調整
       ・上下位置調整
       ・原点の赤い球 ON/OFF
    ============================================================ */
    .panel {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 9999;
      max-height: calc(33dvh - env(safe-area-inset-bottom));
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 14px;
      padding: 8px;
      box-sizing: border-box;
      backdrop-filter: blur(8px);
      font-size: 12px;
    }

    .marker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .marker-label {
      color: #cbd5e1;
      font-weight: 700;
      white-space: nowrap;
    }

    #current-model-name {
      font-size: 14px;
      font-weight: 900;
      color: #fff;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .actions a,
    .actions button,
    .origin-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      background: #fff;
      color: #111827;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 900;
      border: 0;
      font-size: 12px;
      box-sizing: border-box;
    }

    .actions button:disabled {
      opacity: 0.55;
    }

    .adjust-controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 8px;
      align-items: center;
    }

    .control-row {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }

    .control-row span {
      color: #e5e7eb;
      font-weight: 800;
      white-space: nowrap;
    }

    .control-row input[type="range"] {
      width: 100%;
      min-width: 0;
    }

    .origin-toggle {
      grid-row: 1 / span 2;
      grid-column: 2;
      min-width: 72px;
      background: #fecaca;
      color: #7f1d1d;
    }

    .origin-toggle.is-off {
      background: #e5e7eb;
      color: #374151;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      overflow: hidden !important;
      background: transparent !important;
      z-index: 1 !important;
    }

    /* ⭕ 変更後のCSS */
    body > video,
    video#arjs-video,
    video.arjs-video,
    .arjs-video {
      position: fixed !important;
      left: 50% !important;
      top: 50% !important; /* 👈 top: 0 から 50% に変更 */
      right: auto !important;
      bottom: auto !important;
      width: var(--camera-vw, 100vw) !important;
      height: var(--camera-vh, 100dvh) !important; /* 👈 新しい計算変数に対応 */
      min-width: var(--camera-vw, 100vw) !important;
      min-height: var(--camera-vh, 100dvh) !important; /* 👈 新しい計算変数に対応 */
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      object-position: center center !important;
      transform: translate(-50%, -50%) !important; /* 👈 上下左右の中央寄せに修正 */
      transform-origin: center center !important;
      background: #000 !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }

    a-scene canvas,
    canvas.a-canvas,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: var(--real-vw, 100vw) !important;
      height: var(--real-vh, 100dvh) !important;
      background: transparent !important;
      z-index: 2 !important;
      pointer-events: none !important;
    }

    .a-enter-vr, .a-enter-ar {
      display: none !important;
    }

  </style>
</head>

  <script>
    const statusEl = document.getElementById('status');
    const nameEl = document.getElementById('current-model-name');
    const addButton = document.getElementById('add-collection');
    const countEl = document.getElementById('collected-count');
    const visibleIds = new Set();
    let currentId = null;

    function updateCount() {
      if (!countEl || typeof getCollection !== 'function') return;
      countEl.textContent = `${getCollection().length} / ${window.DINOSAURS.length}`;
    }

    function setCurrent(id) {
      currentId = id;
      const dino = id && typeof findDinosaur === 'function' ? findDinosaur(id) : null;
      if (!dino) {
        if (nameEl) nameEl.textContent = '待機中';
        if (statusEl) statusEl.textContent = 'マーカーを探しています。マーカー全体が画面に入るようにしてください。';
        if (typeof window.refreshARAdjustPanel === 'function') window.refreshARAdjustPanel();
        if (addButton) {
          addButton.disabled = true;
          addButton.textContent = 'コレクションに追加';
        }
        return;
      }

      if (typeof window.refreshARAdjustPanel === 'function') window.refreshARAdjustPanel();
      if (nameEl) nameEl.textContent = dino.name;
      if (statusEl) statusEl.textContent = `${dino.name} を認識しました。3Dモデルが見えるか確認してください。`;
      if (addButton) {
        addButton.disabled = false;
        const already = getCollection().includes(id);
        addButton.textContent = already ? '追加済み' : 'コレクションに追加';
      }
      makeRendererTransparent();
    }

    document.querySelectorAll('a-marker[data-dino-id]').forEach((marker) => {
      const id = marker.dataset.dinoId;
      marker.addEventListener('markerFound', () => {
        visibleIds.add(id);
        setCurrent(id);
      });
      marker.addEventListener('markerLost', () => {
        visibleIds.delete(id);
        setCurrent([...visibleIds][0] || null);
      });
    });

    if (addButton) {
      addButton.addEventListener('click', () => {
        if (!currentId) return;
        const dino = findDinosaur(currentId);
        addToCollection(currentId);
        updateCount();
        setCurrent(currentId);
        if (statusEl) statusEl.textContent = `${dino.name} をコレクションに追加しました。`;
      });
    }

    const sceneEl = document.querySelector('a-scene');
    if (sceneEl) {
      sceneEl.addEventListener('renderstart', () => {
        makeRendererTransparent();
        setTimeout(makeRendererTransparent, 500);
      });
    }

    window.addEventListener('error', (e) => {
      if (statusEl) statusEl.textContent = 'エラー: ' + (e.message || '不明なエラー');
    });

    /* ============================================================
       本番用の調整機能
       URLに ?demo=1 を付けなくても常に使えます。

       できること：
       ・全モデルの親要素 ar-model-root の scale を変更
       ・全モデルの親要素 ar-model-root の Y位置を変更
       ・原点確認用の赤い球 demo-origin-ball を表示/非表示

       注意：
       ここで変えた値は画面確認用です。リロードすると初期値に戻ります。
       良い値が見つかったら dinosaurs.js の arFitTarget / arYOffset に反映してください。
    ============================================================ */
    function setupProductionAdjustPanel() {
      const scaleInput = document.getElementById('demo-scale');
      const scaleValue = document.getElementById('demo-scale-value');
      const yInput = document.getElementById('demo-y');
      const yValue = document.getElementById('demo-y-value');
      const originToggle = document.getElementById('origin-toggle');

      const modelRoots = document.querySelectorAll('.ar-model-root');
      const originBalls = document.querySelectorAll('.demo-origin-ball');

      // 原点確認用の赤い球は「モデルの親要素」の中に入っていると、
      // サイズ・上下調整と一緒に動いてしまい、本当のマーカー原点が分かりにくくなります。
      // そのため、読み込み時に a-marker 直下へ移動して、常に marker の 0,0,0 を示すようにします。
      originBalls.forEach((ball) => {
        const root = ball.closest('.ar-model-root');
        const marker = ball.closest('a-marker');
        if (root && marker && ball.parentElement !== marker) {
          marker.insertBefore(ball, root);
        }
      });

      let showOrigin = true;

      // 恐竜ごとの調整差分です。
      // 画面表示の「0.00」は dinosaurs.js の arControlBaseScale / arControlBaseYOffset を意味します。
      const adjustByDino = {};

      function getRootDinoId(root) {
        const marker = root.closest('a-marker');
        return marker ? marker.dataset.dinoId : null;
      }

      function getDino(id) {
        return window.DINOSAURS?.find(d => d.id === id) || null;
      }

      function getAdjust(id) {
        if (!id) return { scaleDelta: 0, yDelta: 0 };
        if (!adjustByDino[id]) adjustByDino[id] = { scaleDelta: 0, yDelta: 0 };
        return adjustByDino[id];
      }

      function getBaseScale(dino) {
        return Number(dino?.arControlBaseScale ?? 1);
      }

      function getBaseY(dino) {
        return Number(dino?.arControlBaseYOffset ?? 0);
      }

      function applyAdjustSettings() {
        const activeId = currentId;
        const activeAdjust = getAdjust(activeId);

        if (scaleValue) scaleValue.textContent = activeAdjust.scaleDelta.toFixed(2);
        if (yValue) yValue.textContent = activeAdjust.yDelta.toFixed(2);

        // 各モデルに、それぞれの基準値 + そのモデル用の差分を適用します。
        // サイズは「足し算」だと 0.20 など小さいモデルでマイナスになりやすいため、
        // 2の累乗倍率にして、0.00=基準、+1.00=2倍、-1.00=半分にしています。
        modelRoots.forEach((root) => {
          const id = getRootDinoId(root);
          const dino = getDino(id);
          const adjust = getAdjust(id);
          const scale = Math.max(0.01, getBaseScale(dino) * Math.pow(2, adjust.scaleDelta));
          const y = getBaseY(dino) + adjust.yDelta;
          root.setAttribute('scale', `${scale} ${scale} ${scale}`);
          root.setAttribute('position', `0 ${y} 0`);
        });

        document.querySelectorAll('.demo-origin-ball').forEach((ball) => {
          ball.setAttribute('visible', showOrigin);
        });

        if (originToggle) {
          originToggle.textContent = showOrigin ? '原点ON' : '原点OFF';
          originToggle.classList.toggle('is-off', !showOrigin);
          originToggle.setAttribute('aria-pressed', String(showOrigin));
        }
      }

      // 今認識している恐竜の調整値をスライダーへ反映します。
      window.refreshARAdjustPanel = function refreshARAdjustPanel() {
        const adjust = getAdjust(currentId);
        if (scaleInput) scaleInput.value = String(adjust.scaleDelta);
        if (yInput) yInput.value = String(adjust.yDelta);
        applyAdjustSettings();
      };

      scaleInput?.addEventListener('input', () => {
        const ids = currentId ? [currentId] : window.DINOSAURS.map(d => d.id);
        ids.forEach((id) => { getAdjust(id).scaleDelta = Number(scaleInput.value || 0); });
        applyAdjustSettings();
      });

      yInput?.addEventListener('input', () => {
        const ids = currentId ? [currentId] : window.DINOSAURS.map(d => d.id);
        ids.forEach((id) => { getAdjust(id).yDelta = Number(yInput.value || 0); });
        applyAdjustSettings();
      });

      originToggle?.addEventListener('click', () => {
        showOrigin = !showOrigin;
        applyAdjustSettings();
      });

      applyAdjustSettings();
    }

    setupProductionAdjustPanel();

    updateCount();
  </script>
</body>
</html>
